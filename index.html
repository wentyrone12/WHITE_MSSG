<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WHITE_MSSG Auth</title>

  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#050505">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WHITE_MSSG">
</head>

<body>

  <div class="container">
    <h1>WHITE_MSSG</h1>

    <!-- LOGIN -->
    <div id="loginForm" class="form active">
      <input type="email" id="loginEmail" placeholder="Email">
      <input type="password" id="loginPassword" placeholder="Password">

      <label class="show-password">
        <input type="checkbox" onclick="togglePassword('loginPassword')">
        Show Password
      </label>
      <button onclick="login()">Login</button>

      <div class="links">
        <span onclick="showForm('forgotForm')">Forgot Password</span>
        <span onclick="showForm('signupForm')">Sign Up</span>
      </div>
    </div>

    <!-- SIGN UP -->
    <div id="signupForm" class="form">
      <input type="text" id="signupUsername" placeholder="Username">
      <input type="email" id="signupEmail" placeholder="Email">
      <input type="password" id="signupPassword" placeholder="Password">
      <input type="password" id="signupConfirmPassword" placeholder="Confirm Password">

      <label class="show-password">
        <input type="checkbox" onclick="togglePassword('signupPassword','signupConfirmPassword')">
        Show Password
      </label>
      <button onclick="signUp()">Create Account</button>

      <div class="links">
        <span onclick="showForm('loginForm')">Back to Login</span>
      </div>
    </div>

    <!-- FORGOT -->
    <div id="forgotForm" class="form">
      <input type="email" id="forgotEmail" placeholder="Enter your email">
      <button onclick="resetPassword()">Send Reset Link</button>

      <div class="links">
        <span onclick="showForm('loginForm')">Back to Login</span>
      </div>
    </div>
  </div>

  <div class="footer-tag" style="color: greenyellow;">Made by Wenxyz</div>

  <script src="ui.js"></script>
  <script type="module" src="app.js"></script>

  <script src="pwa.js"></script>

</body>

</html>
